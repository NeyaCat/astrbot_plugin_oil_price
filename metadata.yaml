name: astrbot_plugin_oil_price # 插件唯一识别名
display_name: 全国油价 # WebUI / 插件市场展示名
short_desc: 每日自动抓取全国各省油价，分析最低价并出图推送。 # 市场卡片短描述
desc: |
  全国油价查询与计算插件。

  功能：
  - 播报地区维护（配置面板 / 自定义页面多选）—— 只决定 /今日油价 与定时推送展示哪些省
  - 历史油价初始化（直连东方财富 datacenter，一键回填**全国 31 省**今年数据）
  - 每日 07:05 自动拉取今日油价入库（全国 31 省全标号，跟随 AstrBot 全局时区）
  - 个人功能（/看看油价、/我要加油）查到库里没有当日数据的省份时，自动补一次当日油价
    （油价日每天 07:00 分界，同一省份每天只请求一次，失败也记账）
  - /今日油价、/看看油价、/我要加油 收到后会先贴一个 👌 表情再出图，避免群里干等
  - /油价设置 广东 92（或 /油价设置地区、/油价设置油号）只写本地偏好，不触发任何请求
  - 库里有数据就出图；凌晨 07:00 前展示的是前一天挂牌价，图上会标注数据日期
    （只有空库才提示「将在每日 07:05 后自动抓取」）
  - /今日油价：整体播报图（播报地区 × 多油号），涨红跌绿（中国习惯）
  - /看看油价 省份 油号：单省 + 单油号大图，顶部价格 hero 屏 + 六行指标，加油建议内嵌同图
  - /我要加油 30升 / 300元 [省份] [油号]：按今日挂牌价精确换算，出「加油机结算单」图
  - 建议附连击轮数/累计幅度、调价节奏、年内位置、当月累计四项证据；连续强上涨时升级为「现在就加满」
  - 推送白名单（机器人名:QQ号 / QQ群号），仅限制定时推送
  - 图片主题按北京时间的每日晨昏点自动切换（白天浅色 / 夜间深色），无需配置
  - 配置页「初始化进度」自动局部刷新（运行中 1s / 空闲 4s 轮询，日志增量追加），
    后台任务从聊天侧启动也能实时看到；标签页隐藏时暂停轮询
  - 可选 HTTP 取图接口（独立端口，type=report|province|calc，返回图片二进制，不走白名单）
  - 该端口根路径还带一个**网页查询界面**：多选地区/油号查油价、单选地区/油号算油费；
    页面只用相对路径调接口，反向代理到域名也能直接用
