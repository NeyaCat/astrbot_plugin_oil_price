name: astrbot_plugin_oil_price # 插件唯一识别名
display_name: 全国油价 # WebUI / 插件市场展示名
short_desc: 每天自动抓取全国 31 省油价，涨红跌绿出图，支持单省查询与油费计算。
desc: |
  全国油价查询与计算插件：每天自动抓取全国 31 省成品油挂牌价，涨红跌绿出图推送。

  - `/今日油价` 整体播报图 · `/看看油价 广东 92` 单省单号大图（加油建议内嵌） · `/我要加油 30升` 加油机结算单图
  - 历史一键初始化、每日定时抓取、缺当日数据自动补一次；`/油价设置` 记住常用地区与油号
  - 推送白名单 · 白天浅色 / 夜间深色自动切换 · 可选 HTTP 取图接口与网页查询界面

version: 2.9.2
author: NeyaCat # 插件作者（市场 plugin_id = 作者/插件名）
repo: https://github.com/NeyaCat/astrbot_plugin_oil_price # 插件仓库地址
astrbot_version: ">=4.9.2" # 依赖 KV 存储与 html_render
tags:
